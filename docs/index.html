<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>

<body>
    <header style="margin-top: 50px;">
        <h1>Calculator App</h1>
    </header>

    <section id = "contentArea">
        <label for="num1">First Number</label>
        <input id = "num1" type="number" placeholder = "Enter a value">
        <br>
        <label for="num2">Second Number</label>
        <input id = "num2" type="number" placeholder = "Enter a value" maxlength=10>

        <h3 style="text-align: center;">Choose Operation </h3>
        <div id="operations">
            <button class = "opBtn" id = "addBtn">Add (+)</button>
            <button class = "opBtn" id = "subBtn">Subtract(-)</button>
            <button class = "opBtn" id = "mulBtn">Multiply(*)</button>
            <button class = "opBtn" id = "divBtn">Divide(/)</button>
        </div>

        <div id = "outputBox">
            <h3><u>Results</u></h3>
            <p id = "results">
                Results Will be Shown here
            </p>
        </div>
    </section>

</body>
<script src="script.js"></script>
</html>
